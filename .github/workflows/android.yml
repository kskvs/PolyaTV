name: Android
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Dart sources
        # Keep analyzer errors fatal while Arc's existing info and warning backlog is triaged.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --flavor github
      - uses: actions/upload-artifact@v4
        with:
          name: PolyaTV-debug
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          if-no-files-found: error
